name: Build APK

# Builds the app on GitHub's servers (they have the Android SDK), runs the unit
# tests, and makes the APK downloadable:
#  - every push / pull request: Actions tab → run → "RDMRadio-debug-apk" artifact
#  - pushing a tag like v1.0.0: also attached to a GitHub Release
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to create a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RDMRadio-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RDMRadio-debug-apk
          path: RDMRadio-debug.apk

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: RDMRadio-debug.apk
